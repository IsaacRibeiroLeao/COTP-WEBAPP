<div class="login-container">
  <div class="login-content">
    <h2 class="login-title">Sistema de Gestão COTP</h2>
    <p class="login-subtitle">Entre na sua conta</p>
    
    <div class="login-card">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div *ngIf="errorMessage" class="error-message" role="alert">
          {{ errorMessage }}
        </div>

        <div class="form-group">
          <label for="username" class="form-label">Usuário</label>
          <input id="username" name="username" type="text" formControlName="username" required
            class="form-input" placeholder="Digite seu usuário">
          <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" 
            class="text-red-500 text-xs mt-1">
            Usuário é obrigatório
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Senha</label>
          <input id="password" name="password" type="password" formControlName="password" required
            class="form-input" placeholder="Digite sua senha">
          <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" 
            class="text-red-500 text-xs mt-1">
            Senha é obrigatória
          </div>
        </div>

        <div>
          <button type="submit" [disabled]="loginForm.invalid || isLoading" class="login-button">
            <span *ngIf="isLoading" class="mr-2">
              <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
            </span>
            Entrar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
